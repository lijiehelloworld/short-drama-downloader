name: Build Hongguo Windows EXE

on:
  push:
    branches:
      - feature/hongguo-web-windows-exe
    paths:
      - hongguo-web/**
      - .github/workflows/build-hongguo-windows.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source and bundled FFmpeg only
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch "$env:GITHUB_REF_NAME" "https://github.com/$env:GITHUB_REPOSITORY.git" .
          git sparse-checkout set hongguo-web "源码_开源版/插件"

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r hongguo-web/requirements-windows.txt

      - name: Test application logic
        env:
          PYTHONPATH: hongguo-web
        run: python -m unittest discover -s hongguo-web/tests -v

      - name: Build single EXE
        run: |
          $arguments = @('--clean', '--noconfirm', '--onefile', '--windowed', '--name', 'HongguoDownloader', '--paths', 'hongguo-web', '--add-data', 'hongguo-web/static;static')
          $media = Get-ChildItem '源码_开源版/插件' -File | Where-Object { $_.Extension -in '.dll', '.exe' }
          foreach ($filename in @('ffmpeg.exe', 'ffprobe.exe')) {
            if (-not (Test-Path "源码_开源版/插件/$filename")) { throw "Missing $filename" }
          }
          foreach ($file in $media) { $arguments += @('--add-binary', "$($file.FullName);ffmpeg") }
          $arguments += 'hongguo-web/windows_app.py'
          python -m PyInstaller @arguments
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller build failed' }

      - name: Check frozen application and prepare artifact
        run: |
          & .\dist\HongguoDownloader.exe --self-test --self-test-log=dist/self-test-error.txt
          if ($LASTEXITCODE -ne 0) {
            if (Test-Path .\dist\self-test-error.txt) { Get-Content .\dist\self-test-error.txt }
            throw 'Frozen application self-test failed'
          }
          $hash = (Get-FileHash .\dist\HongguoDownloader.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  HongguoDownloader.exe" | Set-Content .\dist\SHA256.txt -Encoding ascii
          Copy-Item hongguo-web/WINDOWS_README.txt .\dist\README.txt

      - uses: actions/upload-artifact@v4
        with:
          name: HongguoDownloader-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
